---
- name: Network Discovery
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Verificar nmap
      command: which nmap
      register: nmap
      changed_when: false
      failed_when: false

    - name: Verificar ip
      command: which ip
      register: ipcmd
      changed_when: false
      failed_when: false

    - name: Mostrar herramientas
      debug:
        msg:
          nmap: "{{ nmap.stdout | default('NO') }}"
          ip: "{{ ipcmd.stdout | default('NO') }}"
