---
- name: Discovery Completo
  hosts: all
  gather_facts: true

  tasks:

    - name: Resumen ejecutivo
      debug:
        msg:
          hostname: "{{ ansible_hostname | default('N/A') }}"
          fqdn: "{{ ansible_fqdn | default('N/A') }}"
          sistema_operativo: "{{ ansible_distribution | default('N/A') }}"
          version: "{{ ansible_distribution_version | default('N/A') }}"
          kernel: "{{ ansible_kernel | default('N/A') }}"
          arquitectura: "{{ ansible_architecture | default('N/A') }}"
          cpus: "{{ ansible_processor_vcpus | default('N/A') }}"
          memoria_mb: "{{ ansible_memtotal_mb | default('N/A') }}"
          virtualizacion: "{{ ansible_virtualization_type | default('N/A') }}"
          ipv4: "{{ ansible_all_ipv4_addresses | default([]) }}"
