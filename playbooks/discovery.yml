---
- name: Discovery Completo
  hosts: all
  gather_facts: true

  tasks:

    - name: Obtener paquetes instalados
      package_facts:
        manager: auto

    - name: Obtener servicios
      service_facts:

    - name: Resumen ejecutivo
      debug:
        msg:
          hostname: "{{ ansible_hostname }}"
          fqdn: "{{ ansible_fqdn }}"
          sistema_operativo: "{{ ansible_distribution }}"
          version_so: "{{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          arquitectura: "{{ ansible_architecture }}"
          cpus: "{{ ansible_processor_vcpus }}"
          memoria_mb: "{{ ansible_memtotal_mb }}"
          bios: "{{ ansible_bios_version | default('N/A') }}"
          virtualizacion: "{{ ansible_virtualization_type | default('Fisico') }}"
          ipv4: "{{ ansible_all_ipv4_addresses | default([]) }}"
          ipv6: "{{ ansible_all_ipv6_addresses | default([]) }}"

    - name: Mostrar discos
      debug:
        var: ansible_mounts

    - name: Mostrar interfaces
      debug:
        var: ansible_interfaces

    - name: Mostrar servicios activos
      debug:
        msg: >
          {{
            services.values()
            | selectattr('state','equalto','running')
            | map(attribute='name')
            | list
          }}
      vars:
        services: "{{ ansible_facts.services }}"

    - name: Version Python
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Mostrar Python
      debug:
        var: python_version.stdout
