---
- name: Discovery
  hosts: all
  gather_facts: true

  tasks:

    - name: Servidor
      debug:
        msg:
          hostname: "{{ ansible_hostname }}"
          fqdn: "{{ ansible_fqdn }}"
          os: "{{ ansible_distribution }}"
          version: "{{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          cpu: "{{ ansible_processor_vcpus }}"
          memoria: "{{ ansible_memtotal_mb }}"
          ip: "{{ ansible_default_ipv4.address }}"
